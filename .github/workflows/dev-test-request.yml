name: Dev Test Request

# After a PR is merged to main and the DEVELOPMENT deploy succeeds, ask the PR
# author in Google Chat to verify the change on dev. The author confirms by
# commenting `/tested` on the PR, which adds the `dev-tested` label and posts a
# confirmation back to Google Chat. `dev-test-nag.yml` reminds authors about
# merged PRs that are still missing the label.
#
# Configuration:
#   secrets.GCHAT_WEBHOOK_URL  Incoming webhook of the team space (shared with
#                              pr-deadline-reminder.yml).
#   vars.GCHAT_USER_MAP        Optional JSON object mapping GitHub logins to
#                              Google Chat user identifiers, e.g.
#                              {"rlho": "123456789012345678901"}
#                              The value is inserted as <users/VALUE>. Only the
#                              numeric user ID works from a webhook (the email
#                              alias needs user authentication). Logins missing
#                              from the map are shown as plain @login without a
#                              mention.
#   Label `no-dev-test`        Add to a PR to skip the request (e.g. CI-only changes).
#   secrets.PROJECT_TOKEN      Token that can write the organization project
#                              (classic PAT with the `repo` and `project`
#                              scopes; the organization does not allow
#                              fine-grained PATs). Used to move the project
#                              cards of the issues linked to the merged PR to
#                              "Test - Dev". GITHUB_TOKEN cannot access
#                              organization projects. When unset, the card move
#                              is skipped.
#
# Idempotency: a PR is labeled `dev-test-requested` once the request is posted
# and `dev-tested` once confirmed, and PRs carrying either label are skipped, so
# re-running a deploy or repeating `/tested` never posts twice.

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  workflow_run:
    workflows: ["Deploy DEVELOPMENT to App Engine"]
    types: [completed]
  issue_comment:
    types: [created]

jobs:
  request:
    name: Ask the author to test on dev
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Find the PRs merged by this deploy
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The deploy runs once per push to main; a push is normally a single PR merge.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")
                    | select(([.labels[].name] | index("no-dev-test")) == null)
                    | select(([.labels[].name] | index("dev-tested")) == null)
                    | select(([.labels[].name] | index("dev-test-requested")) == null)
                    | select(.user.type != "Bot")
                    | {number, title, html_url, author: .user.login}]' > prs.json
          echo "count=$(jq length prs.json)" >> "$GITHUB_OUTPUT"
          cat prs.json

      - name: Post the request to Google Chat
        if: steps.prs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_USER_MAP: ${{ vars.GCHAT_USER_MAP }}
          DEV_URL: https://dev-booking-app.nyu.edu
        run: |
          if [ -z "${GCHAT_WEBHOOK_URL}" ]; then
            echo "Error: GCHAT_WEBHOOK_URL secret is not set."
            exit 1
          fi
          USER_MAP='{}'
          if [ -n "${GCHAT_USER_MAP}" ]; then
            USER_MAP=$(jq -c '.' <<<"${GCHAT_USER_MAP}") || { echo "Error: GCHAT_USER_MAP is not valid JSON."; exit 1; }
          fi

          # Read from a process substitution (not a pipe) so the loop runs in this shell,
          # and keep going after a failed post so one bad response does not skip the rest.
          gh label create dev-test-requested --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Author was asked to test the change on dev" --force
          FAILED=0
          while read -r pr; do
            NUMBER=$(jq -r '.number' <<<"$pr")
            URL=$(jq -r '.html_url' <<<"$pr")
            AUTHOR=$(jq -r '.author' <<<"$pr")
            MENTION=$(jq -r --arg login "$AUTHOR" '.[$login] // empty' <<<"$USER_MAP")
            if [ -n "$MENTION" ]; then
              WHO="<users/${MENTION}>"
            else
              WHO="@${AUTHOR}"
            fi

            # <URL|text> renders as a link in Google Chat.
            TEXT="${WHO} <${URL}|PR #${NUMBER}> is now on dev. Please test it there and comment \`/tested\` on the PR when it works."

            PAYLOAD=$(jq -n --arg text "$TEXT" --arg dev "$DEV_URL" '{
              text: $text,
              cardsV2: [{
                cardId: "dev-test-request",
                card: { sections: [{ widgets: [{ buttonList: { buttons: [
                  { text: "Open dev", onClick: { openLink: { url: $dev } } }
                ] } }] }] }
              }]
            }')

            HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
              -H "Content-Type: application/json; charset=UTF-8" \
              --data "${PAYLOAD}" \
              "${GCHAT_WEBHOOK_URL}" \
              --connect-timeout 10 --max-time 30 || echo "000")

            if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
              echo "Request for PR #${NUMBER} sent (HTTP ${HTTP_STATUS})"
              # Mark the PR so a re-run of the deploy does not ask again.
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" -f 'labels[]=dev-test-requested' > /dev/null
            else
              echo "Failed to send request for PR #${NUMBER} (HTTP ${HTTP_STATUS})"
              cat /tmp/response.txt
              FAILED=1
            fi
          done < <(jq -c '.[]' prs.json)
          exit "$FAILED"

  move_cards:
    name: Move linked issues to Test - Dev on the project board
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the move script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/move_project_cards.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Find the PRs merged by this deploy
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          NUMBERS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number] | join(" ")')
          echo "numbers=${NUMBERS}" >> "$GITHUB_OUTPUT"
          echo "PRs: ${NUMBERS:-none}"

      - name: Move the linked issues' cards
        if: steps.prs.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: 2
          TARGET_STATUS: Test - Dev
          NUMBERS: ${{ steps.prs.outputs.numbers }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set; project cards were not moved."
            exit 0
          fi
          .github/scripts/move_project_cards.sh "${NUMBERS}"

  confirm:
    name: Record the author's /tested comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/tested')
    runs-on: ubuntu-latest

    steps:
      - name: Check that the commenter is the author of a PR merged to main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          # The workflow-level startsWith is only a cheap filter; require the bare
          # command (optionally followed by whitespace and more text) here.
          if ! [[ "$BODY" =~ ^/tested($|[[:space:]]) ]]; then
            echo "Ignored: the comment does not start with the /tested command."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" > pr.json
          AUTHOR=$(jq -r '.user.login' pr.json)
          MERGED=$(jq -r '.merged_at // empty' pr.json)
          BASE=$(jq -r '.base.ref' pr.json)
          if [ "$COMMENTER" != "$AUTHOR" ]; then
            echo "Ignored: ${COMMENTER} is not the PR author (${AUTHOR})."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$MERGED" ] || [ "$BASE" != "main" ]; then
            echo "Ignored: PR #${NUMBER} is not merged to main."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e '[.labels[].name] | index("dev-tested")' pr.json > /dev/null; then
            echo "Ignored: PR #${NUMBER} is already labeled dev-tested."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' pr.json)" >> "$GITHUB_OUTPUT"

      - name: Label the PR and acknowledge the comment
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh label create dev-tested --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Author verified the change on dev" --force
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" -f 'labels[]=dev-tested' > /dev/null
          # The request label has served its purpose; ignore 404 when it was never set.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels/dev-test-requested" > /dev/null 2>&1 || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='+1' > /dev/null

      - name: Post the confirmation to Google Chat
        if: steps.check.outputs.ok == 'true'
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          NUMBER: ${{ github.event.issue.number }}
          URL: ${{ steps.check.outputs.url }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          if [ -z "${GCHAT_WEBHOOK_URL}" ]; then
            echo "Error: GCHAT_WEBHOOK_URL secret is not set."
            exit 1
          fi
          TEXT="✅ <${URL}|PR #${NUMBER}> was tested on dev by ${COMMENTER}."
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')

          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data "${PAYLOAD}" \
            "${GCHAT_WEBHOOK_URL}" \
            --connect-timeout 10 --max-time 30 || echo "000")

          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Confirmation sent (HTTP ${HTTP_STATUS})"
          else
            echo "Failed to send confirmation (HTTP ${HTTP_STATUS})"
            cat /tmp/response.txt
            exit 1
          fi
